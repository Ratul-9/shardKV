name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, asan, ubsan, tsan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: TSan needs fewer ASLR bits on recent Linux kernels
        if: runner.os == 'Linux' && matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 2 --timeout 1800

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset release
      - run: cmake --build --preset release -j
      # Smoke runs only: prove the benchmarks execute. CI numbers are NOT used for the CV.
      - run: ./build/release/bench/histogram_bench --benchmark_min_time=0.05s
      - run: ./build/release/bench/footprint 100000 slab
      - run: ./build/release/bench/wal_bench --writers=1,4 --seconds=1 --dir=$RUNNER_TEMP/wal
      - run: ./build/release/bench/rcu_bench --map=rcu --readers=2 --seconds=1

  cluster-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset release && cmake --build --preset release -j
      - name: Three nodes, write, kill the leader, read back, linearizability under kills
        run: |
          set -eux
          scripts/cluster_local.sh start
          K=build/release/apps/kvctl
          S=127.0.0.1:8001,127.0.0.1:8002,127.0.0.1:8003
          $K --servers=$S put ci-key ci-value
          scripts/cluster_local.sh kill "$(scripts/cluster_local.sh leader)"
          test "$($K --servers=$S get ci-key)" = ci-value
          scripts/cluster_local.sh stop
          RUNS=2 KILL_EVERY=4 RESULTS_DIR=$RUNNER_TEMP/chaos scripts/chaos_local.sh 20
      - if: always()
        run: tail -n 50 /tmp/lldstore-cluster/*.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lldstore:ci .
      - run: docker run --rm --entrypoint kvctl lldstore:ci status --servers=127.0.0.1:1 || true
